<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1D4A" />
      <stop offset="60%" stop-color="#132352" />
      <stop offset="100%" stop-color="#091230" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D070" />
      <stop offset="100%" stop-color="#D6B552" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172A5E" />
      <stop offset="100%" stop-color="#0F1D4A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Studio Environment -->
  <rect width="800" height="500" rx="24" fill="url(#studioBg)" />
  
  <!-- Subtle Studio Overhead Rig Light Rays -->
  <path d="M150,0 L260,320 L190,320 Z" fill="#F0D070" opacity="0.06" />
  <path d="M650,0 L540,320 L610,320 Z" fill="#F0D070" opacity="0.06" />
  <circle cx="400" cy="220" r="180" fill="#F0D070" opacity="0.04" filter="url(#softGlow)" />

  <!-- Studio Ceiling Lighting Grid -->
  <g stroke="#172A5E" stroke-width="2" opacity="0.4">
    <line x1="100" y1="30" x2="700" y2="30" />
    <line x1="150" y1="50" x2="650" y2="50" />
    <line x1="200" y1="0" x2="200" y2="60" />
    <line x1="400" y1="0" x2="400" y2="60" />
    <line x1="600" y1="0" x2="600" y2="60" />
  </g>

  <!-- Main Broadcast News Desk Anchor Setup -->
  <ellipse cx="400" cy="410" rx="260" ry="65" fill="#132352" stroke="#F0D070" stroke-width="2" stroke-opacity="0.3" />
  <ellipse cx="400" cy="400" rx="220" ry="45" fill="#172A5E" />

  <!-- Main Multi-Screen Monitor Backdrop -->
  <rect x="220" y="100" width="360" height="210" rx="16" fill="url(#screenGrad)" stroke="#172A5E" stroke-width="3" />
  
  <!-- Waveform & Broadcast Feed on Main Screen -->
  <g opacity="0.85">
    <!-- Screen Header Bar -->
    <rect x="235" y="115" width="330" height="24" rx="6" fill="#091230" />
    <circle cx="250" cy="127" r="4" fill="#EF4444" />
    <text x="262" y="131" fill="#F7F8FC" font-size="10" font-family="sans-serif" font-weight="bold">LIVE FEED // ZEIN HUB STUDIO</text>
    <text x="510" y="131" fill="#F0D070" font-size="10" font-family="monospace" font-weight="bold">4K 60P</text>

    <!-- Audio Waveform Graphic inside Screen -->
    <path d="M250,210 Q280,160 310,210 T370,210 T430,210 T490,210 T550,210" fill="none" stroke="#F0D070" stroke-width="2.5" />
    <path d="M250,210 Q280,180 310,210 T370,210 T430,210 T490,210 T550,210" fill="none" stroke="#22A06B" stroke-width="1.5" opacity="0.7" />

    <!-- Virtual Studio Horizon Grid Lines -->
    <line x1="235" y1="260" x2="565" y2="260" stroke="#F0D070" stroke-width="1" opacity="0.2" />
    <line x1="235" y1="280" x2="565" y2="280" stroke="#F0D070" stroke-width="1" opacity="0.1" />
  </g>

  <!-- Broadcast Camera Rig on Left -->
  <g transform="translate(100, 220)">
    <!-- Tripod Legs -->
    <line x1="50" y1="70" x2="10" y2="230" stroke="#F0D070" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="50" y1="70" x2="50" y2="230" stroke="#C8D1E3" stroke-width="3" opacity="0.4" />
    <line x1="50" y1="70" x2="90" y2="230" stroke="#F0D070" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <!-- Camera Body -->
    <rect x="25" y="20" width="60" height="50" rx="8" fill="#091230" stroke="#F0D070" stroke-width="2" />
    <!-- Teleprompter Hood -->
    <polygon points="85,25 125,10 125,80 85,65" fill="#132352" stroke="#F0D070" stroke-width="1.5" />
    <!-- Tally Red Light -->
    <rect x="45" y="10" width="16" height="8" rx="3" fill="#EF4444" filter="url(#softGlow)" />
    <!-- Lens Reflection -->
    <circle cx="105" cy="45" r="14" fill="#0F1D4A" stroke="#F0D070" stroke-width="2" />
    <circle cx="105" cy="45" r="7" fill="#F0D070" opacity="0.7" />
  </g>

  <!-- Studio Boom / Broadcast Mic on Right -->
  <g transform="translate(630, 200)">
    <path d="M50,0 L20,90 L-20,130" fill="none" stroke="#F0D070" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <!-- Mic Shockmount & Capsule -->
    <rect x="-35" y="125" width="22" height="42" rx="10" fill="#091230" stroke="#F0D070" stroke-width="2" />
    <line x1="-35" y1="140" x2="-13" y2="140" stroke="#F0D070" stroke-width="1" />
    <line x1="-35" y1="150" x2="-13" y2="150" stroke="#F0D070" stroke-width="1" />
  </g>

  <!-- Central Badge: Zein Hub Studio Accreditation -->
  <g transform="translate(325, 340)">
    <rect x="0" y="0" width="150" height="36" rx="18" fill="#091230" stroke="#F0D070" stroke-width="1.5" />
    <circle cx="20" cy="18" r="6" fill="#F0D070" />
    <text x="35" y="22" fill="#F7F8FC" font-size="11" font-family="sans-serif" font-weight="bold">ON-AIR STUDIO</text>
  </g>
</svg>
