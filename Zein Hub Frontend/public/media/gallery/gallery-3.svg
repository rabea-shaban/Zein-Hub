<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1D4A" />
      <stop offset="100%" stop-color="#091230" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#g3Bg)" />
  <!-- Sound Waveform Grid & Studio Mixer -->
  <g transform="translate(100, 80)">
    <!-- Acoustic Panel Background -->
    <rect x="0" y="0" width="400" height="180" rx="12" fill="#132352" stroke="#172A5E" stroke-width="2" />
    <!-- Audio Waveforms -->
    <path d="M20,90 Q60,20 100,90 T180,90 T260,90 T340,90 T380,90" fill="none" stroke="#F0D070" stroke-width="3" />
    <path d="M20,90 Q60,40 100,90 T180,90 T260,90 T340,90 T380,90" fill="none" stroke="#22A06B" stroke-width="2" opacity="0.6" />
    <!-- Broadcast Headphones Outline -->
    <path d="M140,90 C140,40 260,40 260,90" fill="none" stroke="#F0D070" stroke-width="5" stroke-linecap="round" />
    <rect x="125" y="80" width="20" height="35" rx="8" fill="#F0D070" />
    <rect x="255" y="80" width="20" height="35" rx="8" fill="#F0D070" />
    <!-- Podcast Microphone Silhouette -->
    <rect x="185" y="60" width="30" height="60" rx="15" fill="#091230" stroke="#F0D070" stroke-width="2" />
  </g>
  <rect x="40" y="40" width="135" height="28" rx="14" fill="#091230" stroke="#F0D070" stroke-width="1.5" />
  <circle cx="58" cy="54" r="5" fill="#F0D070" />
  <text x="72" y="58" fill="#F7F8FC" font-size="11" font-family="sans-serif" font-weight="bold">PODCAST SUITE</text>
  <text x="300" y="340" fill="#F7F8FC" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">استوديو تسجيل وهندسة البودكاست</text>
</svg>
