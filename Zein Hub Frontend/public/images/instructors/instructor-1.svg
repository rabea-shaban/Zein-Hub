<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1626" />
      <stop offset="100%" stop-color="#182C44" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE399" />
      <stop offset="50%" stop-color="#E5A91A" />
      <stop offset="100%" stop-color="#C68B0E" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarBg1)" />
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldRing)" stroke-width="3" />
  
  <!-- Male Presenter / Journalist Stylized Silhouette -->
  <!-- Head -->
  <circle cx="100" cy="72" r="32" fill="#F7CE5F" />
  <!-- Hair & Glasses -->
  <path d="M 70,68 C 70,40 130,40 130,68 C 120,48 80,48 70,68 Z" fill="#0A1626" />
  <!-- Glasses -->
  <rect x="78" y="65" width="18" height="12" rx="3" fill="none" stroke="#0A1626" stroke-width="2.5" />
  <rect x="104" y="65" width="18" height="12" rx="3" fill="none" stroke="#0A1626" stroke-width="2.5" />
  <line x1="96" y1="71" x2="104" y2="71" stroke="#0A1626" stroke-width="2.5" />

  <!-- Body / Suit -->
  <path d="M 45,175 C 45,125 155,125 155,175 Z" fill="#102238" stroke="url(#goldRing)" stroke-width="2" />
  <!-- Shirt & Tie -->
  <polygon points="100,120 88,140 112,140" fill="#FFFFFF" />
  <polygon points="97,140 103,140 101,170 99,170" fill="#E5A91A" />
  <!-- Lapel -->
  <path d="M 75,130 L 100,165 L 125,130" fill="none" stroke="#243B53" stroke-width="3" />
</svg>
