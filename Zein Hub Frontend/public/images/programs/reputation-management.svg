<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="rmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132352" />
      <stop offset="100%" stop-color="#0F1D4A" />
    </linearGradient>
  </defs>
  <rect width="600" height="375" rx="16" fill="url(#rmBg)" />
  <!-- Brand Protection Shield & Sentiment Radar -->
  <g transform="translate(190, 70)">
    <!-- Radar Rings -->
    <circle cx="110" cy="110" r="90" fill="none" stroke="#F0D070" stroke-width="1.5" opacity="0.3" />
    <circle cx="110" cy="110" r="60" fill="none" stroke="#F0D070" stroke-width="1.5" opacity="0.5" />
    <!-- Radar Sweep Line -->
    <line x1="110" y1="110" x2="180" y2="40" stroke="#22A06B" stroke-width="2.5" />
    <!-- Shield in Center -->
    <path d="M110,60 L145,75 L145,115 C145,145 110,165 110,165 C110,165 75,145 75,115 L75,75 Z" fill="#091230" stroke="#F0D070" stroke-width="2.5" />
    <path d="M100,110 L107,117 L122,102" fill="none" stroke="#F0D070" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
