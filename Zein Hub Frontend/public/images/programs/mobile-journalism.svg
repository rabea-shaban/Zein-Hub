<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1626" />
      <stop offset="50%" stop-color="#102238" />
      <stop offset="100%" stop-color="#050C17" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE399" />
      <stop offset="50%" stop-color="#E5A91A" />
      <stop offset="100%" stop-color="#C68B0E" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182C44" />
      <stop offset="100%" stop-color="#0A1626" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#182C44" stroke-width="1" opacity="0.4">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="400" cy="225" r="160" fill="#E5A91A" opacity="0.12" filter="blur(40px)" />

  <!-- Smartphone Frame -->
  <rect x="290" y="80" width="220" height="300" rx="36" fill="#0D1B2E" stroke="url(#goldGrad)" stroke-width="4" />
  <rect x="305" y="98" width="190" height="264" rx="20" fill="url(#screenGrad)" />
  
  <!-- Camera Lens module -->
  <circle cx="400" cy="180" r="48" fill="#0A1626" stroke="#E5A91A" stroke-width="3" />
  <circle cx="400" cy="180" r="32" fill="#182C44" stroke="#FBE399" stroke-width="2" />
  <circle cx="400" cy="180" r="16" fill="#E5A91A" opacity="0.8" />
  <circle cx="392" cy="172" r="5" fill="#FFFFFF" opacity="0.9" />

  <!-- Audio Waveform Bars in phone screen -->
  <g fill="url(#goldGrad)">
    <rect x="330" y="270" width="6" height="24" rx="3" />
    <rect x="342" y="255" width="6" height="42" rx="3" />
    <rect x="354" y="260" width="6" height="34" rx="3" />
    <rect x="366" y="245" width="6" height="58" rx="3" />
    <rect x="378" y="265" width="6" height="30" rx="3" />
    <rect x="390" y="250" width="6" height="50" rx="3" />
    <rect x="402" y="240" width="6" height="66" rx="3" />
    <rect x="414" y="255" width="6" height="44" rx="3" />
    <rect x="426" y="262" width="6" height="32" rx="3" />
    <rect x="438" y="248" width="6" height="52" rx="3" />
    <rect x="450" y="268" width="6" height="24" rx="3" />
    <rect x="462" y="274" width="6" height="16" rx="3" />
  </g>

  <!-- REC Badge -->
  <rect x="320" y="115" width="54" height="22" rx="6" fill="#E53E3E" />
  <circle cx="330" cy="126" r="4" fill="#FFFFFF" />
  <text x="340" y="131" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">REC</text>

  <!-- 4K Resolution text -->
  <text x="445" y="131" fill="#FBE399" font-family="monospace" font-size="11" font-weight="bold">4K 60</text>
  
  <!-- MoJo Badge Bottom Overlay -->
  <text x="400" y="420" text-anchor="middle" fill="#FBE399" font-family="sans-serif" font-size="16" font-weight="900" letter-spacing="3">MOBILE JOURNALISM • MOJO STUDIO</text>
</svg>
