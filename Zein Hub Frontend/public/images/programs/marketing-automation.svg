<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="maBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132352" />
      <stop offset="100%" stop-color="#0F1D4A" />
    </linearGradient>
  </defs>
  <rect width="600" height="375" rx="16" fill="url(#maBg)" />
  <!-- Growth Funnel & Automated Workflow Nodes -->
  <g transform="translate(170, 70)">
    <!-- Funnel Sections -->
    <polygon points="20,20 240,20 200,80 60,80" fill="#091230" stroke="#F0D070" stroke-width="2" />
    <polygon points="60,90 200,90 170,150 90,150" fill="#172A5E" stroke="#F0D070" stroke-width="2" />
    <polygon points="90,160 170,160 150,210 110,210" fill="#22A06B" stroke="#F0D070" stroke-width="2" />
    <!-- Automation Loop Gear -->
    <circle cx="210" cy="170" r="30" fill="#091230" stroke="#F0D070" stroke-width="2" />
    <circle cx="210" cy="170" r="10" fill="#F0D070" />
    <line x1="210" y1="130" x2="210" y2="210" stroke="#F0D070" stroke-width="3" />
    <line x1="170" y1="170" x2="250" y2="170" stroke="#F0D070" stroke-width="3" />
  </g>
</svg>
