<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1626" />
      <stop offset="50%" stop-color="#182C44" />
      <stop offset="100%" stop-color="#050C17" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE399" />
      <stop offset="50%" stop-color="#E5A91A" />
      <stop offset="100%" stop-color="#C68B0E" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)" />

  <!-- Studio Camera Illustration -->
  <g transform="translate(180, 70)">
    <!-- Tripod Legs -->
    <line x1="220" y1="230" x2="130" y2="350" stroke="#334E68" stroke-width="6" stroke-linecap="round" />
    <line x1="220" y1="230" x2="220" y2="350" stroke="#243B53" stroke-width="8" stroke-linecap="round" />
    <line x1="220" y1="230" x2="310" y2="350" stroke="#334E68" stroke-width="6" stroke-linecap="round" />

    <!-- Camera Body -->
    <rect x="150" y="90" width="140" height="110" rx="16" fill="#0D1B2E" stroke="url(#goldGrad2)" stroke-width="4" />
    <rect x="70" y="115" width="85" height="60" rx="8" fill="#102238" stroke="#334E68" stroke-width="3" />
    <circle cx="70" cy="145" r="28" fill="#050C17" stroke="url(#goldGrad2)" stroke-width="3" />
    
    <!-- Teleprompter Screen Module -->
    <polygon points="50,90 120,50 120,130 50,150" fill="#E5A91A" opacity="0.15" stroke="#E5A91A" stroke-width="2" />
    
    <!-- Top Viewfinder & On-Air Light -->
    <rect x="190" y="55" width="60" height="35" rx="8" fill="#0A1626" stroke="#334E68" stroke-width="2" />
    <rect x="200" y="30" width="40" height="18" rx="4" fill="#E53E3E" />
    <text x="220" y="43" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="900" text-anchor="middle">ON AIR</text>
  </g>

  <!-- Title Bottom Overlay -->
  <text x="400" y="420" text-anchor="middle" fill="#FBE399" font-family="sans-serif" font-size="16" font-weight="900" letter-spacing="3">TV PRESENTING &amp; BROADCAST ANCHORING</text>
</svg>
