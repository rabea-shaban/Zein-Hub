<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1626" />
      <stop offset="50%" stop-color="#102238" />
      <stop offset="100%" stop-color="#050C17" />
    </linearGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE399" />
      <stop offset="50%" stop-color="#E5A91A" />
      <stop offset="100%" stop-color="#C68B0E" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)" />

  <!-- Investigative Dossier & OSINT Radar Illustration -->
  <g transform="translate(250, 70)">
    <!-- Radar concentric circles -->
    <circle cx="150" cy="150" r="130" fill="none" stroke="#243B53" stroke-width="2" />
    <circle cx="150" cy="150" r="90" fill="none" stroke="#334E68" stroke-width="2" stroke-dasharray="6 4" />
    <circle cx="150" cy="150" r="50" fill="#E5A91A" opacity="0.1" stroke="#E5A91A" stroke-width="2" />
    
    <!-- Crosshairs -->
    <line x1="150" y1="10" x2="150" y2="290" stroke="#334E68" stroke-width="2" />
    <line x1="10" y1="150" x2="290" y2="150" stroke="#334E68" stroke-width="2" />

    <!-- Magnifying Loupe / Dossier Pin -->
    <circle cx="170" cy="130" r="45" fill="none" stroke="url(#goldGrad4)" stroke-width="5" />
    <line x1="202" y1="162" x2="245" y2="205" stroke="url(#goldGrad4)" stroke-width="8" stroke-linecap="round" />
    <circle cx="170" cy="130" r="8" fill="#E53E3E" />
  </g>

  <!-- Title Bottom Overlay -->
  <text x="400" y="420" text-anchor="middle" fill="#FBE399" font-family="sans-serif" font-size="16" font-weight="900" letter-spacing="3">INVESTIGATIVE JOURNALISM &amp; OSINT FORENSICS</text>
</svg>
