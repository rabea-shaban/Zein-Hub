<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1626" />
      <stop offset="50%" stop-color="#102238" />
      <stop offset="100%" stop-color="#050C17" />
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE399" />
      <stop offset="50%" stop-color="#E5A91A" />
      <stop offset="100%" stop-color="#C68B0E" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)" />

  <!-- Studio Podcasting Microphone -->
  <g transform="translate(320, 50)">
    <!-- Shock Mount Outer Ring -->
    <circle cx="80" cy="140" r="75" fill="none" stroke="#334E68" stroke-width="4" stroke-dasharray="10 6" />
    
    <!-- Mic Body -->
    <rect x="55" y="80" width="50" height="110" rx="25" fill="#0D1B2E" stroke="url(#goldGrad3)" stroke-width="4" />
    <rect x="60" y="85" width="40" height="45" rx="18" fill="#182C44" stroke="#E5A91A" stroke-width="1" />
    
    <!-- Grille lines -->
    <line x1="65" y1="95" x2="95" y2="95" stroke="#E5A91A" stroke-width="2" />
    <line x1="65" y1="105" x2="95" y2="105" stroke="#E5A91A" stroke-width="2" />
    <line x1="65" y1="115" x2="95" y2="115" stroke="#E5A91A" stroke-width="2" />

    <!-- Stand & Base -->
    <path d="M 80,215 L 80,310" stroke="#334E68" stroke-width="10" stroke-linecap="round" />
    <ellipse cx="80" cy="315" rx="70" ry="20" fill="#102238" stroke="url(#goldGrad3)" stroke-width="4" />
  </g>

  <!-- Title Bottom Overlay -->
  <text x="400" y="420" text-anchor="middle" fill="#FBE399" font-family="sans-serif" font-size="16" font-weight="900" letter-spacing="3">PODCASTING &amp; AUDIO STORYTELLING</text>
</svg>
