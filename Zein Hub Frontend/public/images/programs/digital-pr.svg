      <stop offset="0%" stop-color="#0F1D4A" />
      <stop offset="100%" stop-color="#132352" />
    </linearGradient>
  </defs>
  <rect width="600" height="375" rx="16" fill="url(#prBg)" />
  <!-- Media Network & Press Relations Node Mesh -->
